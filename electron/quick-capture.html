<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self';"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 伴侣工具条</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;color:#17312a}.shell{height:100%;padding:1px;border:1px solid #b8d8cd;border-radius:8px;background:#f8fcfa;box-shadow:0 4px 14px rgba(18,59,48,.14);overflow:hidden;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:0;height:26px;min-height:26px;-webkit-app-region:drag}.brand{width:17px;height:17px;display:grid;place-items:center;border-radius:5px;background:#145543;color:#fff;font:500 11px STKaiti,KaiTi,serif;flex:none}button{font:inherit;font-weight:400;cursor:pointer;-webkit-app-region:no-drag}button:focus-visible,select:focus-visible{outline:2px solid #7454e7;outline-offset:1px}.student{display:flex;align-items:center;gap:1px;height:20px;min-width:65px;max-width:73px;padding:0 2px;border:0;border-radius:5px;background:transparent;text-align:left;color:#3c5c53}.student:hover{background:#e9f2ef}.student strong{display:block;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8px;font-weight:400;letter-spacing:.01em}.student .chevron{margin-left:auto;color:#5d7a72;font-size:8px}.divider{width:1px;height:13px;margin:0 1px;background:#d6e5df;flex:none}.links,.primary-nav{display:flex;align-items:center;gap:0}.action{height:20px;padding:0 3px;border:0;border-radius:5px;background:transparent;color:#164d40;font-size:8px;font-weight:400;white-space:nowrap}.action:hover{background:#e7f3ee}.action:disabled{opacity:.43;cursor:not-allowed}.action.selected,.action[aria-pressed="true"]{background:#1c6652;color:#fff}.action.copied{background:#7454e7;color:#fff}.action.learning{background:#145f50;color:#fff}.action.learning:hover,.action.learning[aria-expanded="true"]{background:#0d4e42}.action.project-mentor-shortcut{color:#6546c8}.action.project-mentor-shortcut:hover,.action.project-mentor-shortcut[aria-expanded="true"]{background:#eee9ff;color:#4d30af}.action.ai-settings{margin-left:0;padding:0 3px;color:#365f55}.action.ai-settings:hover{color:#164d40}.glyph{font-size:8px;margin-right:1px}.icon{width:17px;height:20px;padding:0;border:0;border-radius:5px;background:transparent;color:#315f52;font-size:12px;line-height:1}.icon:hover{background:#e6f2ed}.spacer{flex:1}[hidden]{display:none!important}.capture{display:none;min-width:0;flex:1}.capture.open{display:grid;gap:0}.capture strong{font-size:8px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.capture span{font-size:7px;color:#5a746a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.capture-actions .action{padding:0 3px}.danger{color:#a32f28}.message{position:absolute;left:5px;right:5px;bottom:0;color:#a32f28;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.message.success{color:#17644f}
.setup{min-height:0;flex:1;overflow:hidden;border-top:1px solid #d9e8e0;padding:9px 2px 5px;display:flex;flex-direction:column}.setup-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.setup h2{font-size:15px;margin:0}.setup p{font-size:11px;line-height:1.45;color:#617b72;margin:6px 0}.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;flex:1;min-height:64px;max-height:180px;overflow:auto;margin:8px 0;grid-auto-rows:min-content}.source{padding:5px;border:1px solid #c8ddd4;border-radius:9px;background:#fff;text-align:left;min-width:0;color:#172b27}.source[aria-pressed="true"]{border:2px solid #1d6652;background:#e5f4ed}.source:disabled{opacity:.5}.source img{width:100%;height:68px;object-fit:contain;background:#edf3f0;border-radius:4px}.source span{display:block;font-size:10px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:4px 1px}.fields{display:grid;grid-template-columns:2fr 1fr;gap:9px}.fields label,.strategy{font-size:11px;display:grid;gap:4px;color:#45675b}select{width:100%;padding:6px;border:1px solid #c8ddd4;border-radius:7px;background:#fff;color:#172b27;min-width:0}.setup-footer{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:8px}.setup .action{height:30px;padding:0 9px;border:1px solid #c6dcd4;border-radius:8px;background:#fff;font-size:11px}.setup .primary{background:#1d6652;color:#fff;border-color:#1d6652}.setup-message{min-height:0!important;color:#a32f28!important;margin:0!important}.setup-message:empty{display:none}.photo-active::after{content:' ●';color:#cf5f28}.modes{display:flex;gap:7px;margin:7px 0;flex-shrink:0}.modes [aria-pressed="true"]{background:#1d6652;color:#fff}.shot-preview{flex:1;min-height:80px;margin:7px 0;display:grid;place-items:center;background:#eaf1ed;border-radius:9px;overflow:hidden}.shot-preview img{width:100%;height:100%;min-height:0;object-fit:contain}.receipt{color:#155143!important}.quick-help{font-size:10px!important}@media(max-width:245px){.student{min-width:58px;max-width:62px}.student strong{max-width:44px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(max-width:270px){.project-mentor-shortcut{display:none!important}}
.brand img{width:17px;height:17px;object-fit:contain;border-radius:50%}.brand{background:transparent}
</style></head><body><div class="shell">
<div class="bar"><div class="brand"><img src="../dist/brand/robogala-round.png" alt="企业 Logo"></div><button class="student" data-action="students" title="切换或编辑当前学生"><strong id="student">选择学生</strong><span class="chevron">⌄</span></button><div class="divider"></div>
<nav id="idle-actions" class="primary-nav" aria-label="Agent伴侣工具分类"><button class="action needs-student" data-action="collect-menu" id="collect" aria-expanded="false"><span class="glyph">＋</span><span class="label">采集</span></button><button class="action needs-student" data-action="organize-menu" id="organize" aria-expanded="false"><span class="glyph">▤</span><span class="label">整理</span></button><button class="action learning needs-student" id="learning" data-action="learning" aria-expanded="false"><span class="glyph">✦</span><span class="label">学习</span></button><button class="action project-mentor-shortcut needs-student" id="project-mentor" data-action="project-mentor" aria-expanded="false"><span class="glyph">◇</span><span class="label">项目</span></button></nav>
<div id="capture" class="capture" aria-live="polite"><strong id="capture-state"></strong><span id="capture-source"></span></div><div id="capture-actions" class="links capture-actions" hidden><button class="action" data-action="highlight">★</button><button class="action" id="pause" data-action="pause">暂停</button><button class="action" data-action="capture-inbox">采集箱</button><button class="action danger" data-action="stop">结束</button></div><span class="spacer" id="spacer"></span><button class="action ai-settings needs-student" id="ai-settings" data-action="ai-settings" title="智能体人设与目标智能体" aria-expanded="false"><span class="glyph">⚙</span><span class="label">AI设置</span></button><button class="icon" data-action="hide" aria-label="隐藏工具条" title="隐藏工具条（可从托盘恢复）">×</button></div>
<section id="screen-setup" class="setup" aria-label="屏幕采集设置" hidden><div class="setup-head"><h2>选择屏幕或窗口</h2><div><button class="action" data-action="screen">刷新来源</button> <button class="icon" data-action="close-screen" aria-label="收起屏幕设置">×</button></div></div><div class="modes" role="group" aria-label="屏幕采集方式"><button class="action" id="mode-quick" aria-pressed="true">快速截屏</button><button class="action" id="mode-continuous" aria-pressed="false">连续采集</button></div><p id="setup-student"></p><div id="sources" class="sources" role="group" aria-label="可采集来源"></div><div id="shot-preview" class="shot-preview" hidden><img id="shot-image" alt="待确认的快速截屏预览"></div><div class="fields"><label>关联范围<select id="screen-project"><option value="">学生资料收件箱</option></select></label><label id="duration-field" hidden>采集时长<select id="screen-duration"><option value="15">15 分钟</option><option value="30" selected>30 分钟</option><option value="60">60 分钟</option><option value="90">90 分钟</option><option value="120">120 分钟</option></select></label></div><div class="setup-footer" id="continuous-controls" hidden><label class="strategy">采集策略<select id="screen-mode"><option value="smart">智能混合（推荐）</option><option value="change">内容变化时保存</option><option value="interval">固定间隔</option></select></label><button class="action primary" data-action="start-screen" id="start-screen" disabled>开始采集</button></div><div class="setup-footer" id="quick-controls"><button class="action" id="choose-again" hidden>重新选源</button><div class="links"><button class="action primary" data-action="take-screen" id="take-screen" disabled>立即截取</button><button class="action primary" data-action="save-screen" id="save-screen" hidden>确认保存</button><button class="action" data-action="screenshot-inbox" id="shot-inbox" hidden>查看收件箱</button></div></div><p id="screen-help" class="quick-help">截取一次，预览确认后保存到学生资料收件箱；关联项目作为投递提示。</p><p id="setup-message" class="setup-message" role="status"></p></section><div id="message" class="message" role="status" aria-live="polite"></div></div><script src="quick-capture-renderer.js"></script></body></html>
