<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent 伴侣</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#17312a}[hidden]{display:none!important}
    .panel{height:100%;border:1px solid #b8d8cd;border-radius:14px;background:#fbfdfc;box-shadow:0 14px 34px rgba(15,57,46,.24);padding:14px;overflow:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}h1{font-size:16px;margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.close{border:0;background:transparent;font-size:22px;color:#45675c}.close:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7856e8;outline-offset:2px}
    .list{display:grid;gap:8px}.target,.scope,.mode-action,.more-action{width:100%;padding:10px 12px;border:1px solid #c8ddd5;border-radius:10px;background:#fff;text-align:left;color:#17312a}.target.selected,.scope.selected{border-color:#1b6753;background:#e9f5ef}.target strong,.scope strong{display:block;font-size:13px}.target span,.scope span{display:block;margin-top:3px;color:#63786f;font-size:11px}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.badge{font-size:10px;padding:2px 5px;border-radius:99px;background:#edf3f0;color:#516d63}.badge.on{background:#d9f2e5;color:#135944}.badge.off{background:#f4ede7;color:#896044}
    .groups{display:flex;gap:5px;margin-bottom:9px}.group{height:30px;padding:0 10px;border:1px solid #c7ddd4;border-radius:8px;background:#fff}.group.active{background:#1b6753;color:#fff;border-color:#1b6753}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.mode-action.active{border-color:#7856e8;background:#f0ecff}.mode-action strong{font-size:13px}.mode-action span{display:block;font-size:10px;color:#657970;margin-top:3px}
    .form{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #dce9e3}.form label{font-size:11px;color:#5a7168;display:grid;gap:4px}.form input,.form select,.form textarea{width:100%;border:1px solid #c7dcd4;border-radius:8px;background:#fff;padding:8px;color:#17312a}.form textarea{height:56px;resize:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{height:34px;border:0;border-radius:9px;background:#1b6753;color:#fff;font-weight:700}.secondary{height:34px;border:1px solid #c7dcd4;border-radius:9px;background:#fff;color:#17312a}.status{min-height:18px;font-size:11px;color:#a23931;margin-top:7px}.hint{font-size:11px;line-height:1.5;color:#5b7169;margin:0 0 9px}.section-title{font-size:11px;color:#6b7f77;margin:10px 0 6px}.empty{padding:16px;text-align:center;color:#6b7f77;font-size:12px;background:#f1f6f3;border-radius:9px}
    /* Compact utility panels: explicit base size prevents browser-default 16px menus. */
    html,body{font-size:11px;line-height:1.35;font-weight:400}
    .panel{height:auto;min-height:0;padding:9px;border-radius:9px;box-shadow:none;overflow:visible}
    body{overflow:auto}header{gap:6px;margin-bottom:6px}h1{font-size:12px;font-weight:400}.close{font-size:17px;width:22px;height:22px;padding:0}
    .list{gap:4px}.target,.scope,.mode-action,.more-action{padding:6px 8px;border-radius:6px;font-size:11px;font-weight:400;line-height:1.35}
    .more-action{min-height:28px}.target strong,.scope strong,.mode-action strong{font-size:11px;font-weight:400}
    .target span,.scope span,.mode-action span{font-size:10px;margin-top:2px}.badges{gap:3px;margin-top:3px}.badge{font-size:9px;padding:1px 4px}
    .groups{gap:3px;margin-bottom:6px}.group{height:25px;padding:0 8px;font-size:11px;border-radius:5px}
    .action-grid{gap:4px}.form{gap:5px;margin-top:7px;padding-top:7px}.form label{font-size:10px;gap:3px}.form input,.form select,.form textarea{padding:5px;border-radius:5px;font-size:11px}.form textarea{height:40px}.row{gap:6px}
    .primary,.secondary{height:28px;font-size:11px;font-weight:400;border-radius:6px}.status{min-height:0;font-size:10px;margin-top:5px}.status:empty{display:none}
    .hint{font-size:10px;line-height:1.4;margin-bottom:6px}.section-title{font-size:10px;margin:5px 0}.empty{font-size:11px;padding:8px}
    .project-choices{width:100%;font-size:11px;padding:5px;border:1px solid #c7dcd4;border-radius:5px;background:white;color:inherit}
    details{margin-top:6px}summary{cursor:pointer;font-size:10px;color:#45675c}
  </style>
</head>
<body><main class="panel"><header><h1 id="title">Agent 伴侣</h1><button class="close" data-command="close" aria-label="关闭">×</button></header><p class="hint" id="hint"></p><div id="content"></div><div id="status" class="status" role="status"></div></main><script src="companion-popover-renderer.js"></script></body>
</html>
