name: Release version integrity

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'release/**'
  workflow_dispatch:

jobs:
  release-version-registry:
    name: Verify release version registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check registry mirrors
        run: node scripts/check-release-version-registry.cjs
      - name: Exercise registry regression tests
        run: node --test tests/release-version-registry.test.cjs tests/version-policy.test.cjs
