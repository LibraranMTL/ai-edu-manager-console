<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>隔离打印验收</title><style>body{font:18px 'Segoe UI','Microsoft YaHei';padding:32px;color:#183440}button,select{font:inherit;padding:12px;margin:10px}p{line-height:1.8}</style><h1>学习卡片打印验收</h1><p>虚构卡片，不连接学生资料或模型。系统打印调用使用测试桩，不发送纸张打印任务。</p><label>方向<select id="orientation"><option value="portrait">竖向</option><option value="landscape">横向</option></select></label><label>类型<select id="original"><option value="">结构化卡片</option><option value="image">图片</option><option value="pdf">多页 PDF</option></select></label><div><button data-format="print">打印</button><button data-format="pdf">导出 PDF</button><button data-format="png">分享图片</button></div><p role="status" id="status">等待操作</p><script>for(const button of document.querySelectorAll('button'))button.onclick=async()=>{document.getElementById('status').textContent='正在处理…';const result=await window.printProbe.run(button.dataset.format,document.getElementById('orientation').value,document.getElementById('original').value);document.getElementById('status').textContent=result.error||JSON.stringify(result);};</script></html>
