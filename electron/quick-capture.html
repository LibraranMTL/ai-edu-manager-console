<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>快捷采集</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#172b27}
    .shell{height:100%;padding:5px 10px;border:1px solid #b9d9cd;border-radius:14px;background:#f8fcfa;box-shadow:0 10px 24px rgba(18,59,48,.22);overflow:hidden}
    .bar{display:flex;align-items:center;gap:7px;min-height:56px;-webkit-app-region:drag}
    .identity{display:grid;min-width:95px;max-width:124px;gap:2px;margin-right:3px}.identity strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity span{font-size:10px;color:#617b72}
    .brand{width:32px;height:32px;display:grid;place-items:center;background:#164f40;border-radius:10px;color:white;font-weight:700;font-size:18px;flex:none}
    button{font:inherit;cursor:pointer;-webkit-app-region:no-drag}button:focus-visible{outline:3px solid #6f4de0;outline-offset:2px}
    .action{height:36px;padding:0 10px;border:1px solid #c8ddd4;border-radius:10px;background:#fff;color:#155143;font-size:12px;font-weight:700;white-space:nowrap}
    .action:hover{background:#e5f4ed}.action:disabled{opacity:.48;cursor:not-allowed}.action.selected{background:#1d6652;color:white;border-color:#1d6652;box-shadow:0 4px 12px rgba(29,102,82,.2)}.action.selected:hover{background:#164f40}
    .icon{width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:#45675b;font-size:19px}.icon:hover{background:#e5f4ed}
    .spacer{flex:1}[hidden]{display:none!important}.details{display:none;border-top:1px solid #d9e8e0;padding-top:9px;margin-top:8px}.details.open{display:block}
    .links{display:flex;gap:7px;flex-wrap:wrap}.notice{font-size:11px;color:#587068;margin:7px 0 0}.capture{display:none;min-width:0;flex:1}.capture.open{display:grid;gap:2px}.capture strong{font-size:12px}.capture span{font-size:10px;color:#5a746a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.danger{color:#a32f28;border-color:#eec6c1}
    .capture strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message{position:absolute;left:12px;right:12px;bottom:3px;color:#a32f28;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
    .shell{display:flex;flex-direction:column}.bar{flex-shrink:0}.setup{min-height:0;flex:1;overflow:auto;border-top:1px solid #d9e8e0;padding:12px 0 16px}.setup-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.setup h2{font-size:16px;margin:0}.setup p{font-size:12px;line-height:1.5;color:#617b72;margin:7px 0}.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:200px;overflow:auto;margin:10px 0}.source{padding:5px;border:1px solid #c8ddd4;border-radius:9px;background:white;text-align:left;min-width:0;color:#172b27}.source[aria-pressed="true"]{border:2px solid #1d6652;background:#e5f4ed}.source:disabled{opacity:.5;cursor:not-allowed}.source img{width:100%;height:68px;object-fit:contain;background:#edf3f0;border-radius:4px}.source span{display:block;font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:4px 1px}.fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}.fields label,.strategy{font-size:12px;display:grid;gap:5px;color:#45675b}select{width:100%;padding:7px;border:1px solid #c8ddd4;border-radius:7px;background:#fff;color:#172b27;min-width:0}.setup-footer{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:10px}.primary{background:#1d6652;color:#fff;border-color:#1d6652}.setup-message{min-height:18px;color:#a32f28!important}.photo-active::after{content:' ●';color:#cf5f28}
    .setup{display:flex;flex-direction:column;overflow:hidden;padding:10px 0 6px}.setup-head,.fields,.setup-footer,.setup>p{flex-shrink:0}.sources{flex:1;min-height:64px;max-height:180px;grid-auto-rows:min-content}.setup-message{min-height:0;margin:0!important}.setup-message:empty{display:none}
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">
      <div class="brand" aria-hidden="true">教</div>
      <div class="identity"><strong id="student">选择学生</strong><span>快捷采集 · 先接收后投递</span></div>
      <div id="idle-actions" class="links">
        <button class="action needs-student" data-action="screen" aria-pressed="false">屏幕采集</button>
        <button class="action needs-student" data-action="audio" aria-pressed="false" title="打开录音采集页面，不在浮条录音">录音</button>
        <button class="action needs-student" data-action="photo" aria-pressed="false">拍照</button>
      </div>
      <div id="capture" class="capture" aria-live="polite"><strong id="capture-state"></strong><span id="capture-source"></span></div>
      <div id="capture-actions" class="links" hidden>
        <button class="action" data-action="highlight" title="重点截取">★</button>
        <button class="action" id="pause" data-action="pause">暂停</button>
        <button class="action" data-action="capture-inbox" title="打开本次屏幕采集箱">采集箱</button>
        <button class="action danger" data-action="stop">结束</button>
      </div>
      <span class="spacer" id="spacer"></span>
      <button class="icon" id="more" data-action="more" aria-label="更多采集方式" aria-expanded="false" aria-controls="details" title="更多采集方式">⋯</button>
      <button class="icon" data-action="hide" aria-label="隐藏工具条" title="隐藏工具条（可从托盘恢复）">×</button>
    </div>
    <section id="screen-setup" class="setup" aria-label="屏幕采集设置" hidden>
      <div class="setup-head"><h2>选择屏幕或窗口</h2><div><button class="action" data-action="screen">刷新来源</button> <button class="icon" data-action="close-screen" aria-label="收起屏幕设置">×</button></div></div>
      <p id="setup-student"></p>
      <div id="sources" class="sources" role="group" aria-label="可采集来源"></div>
      <div class="fields"><label>关联范围<select id="screen-project"><option value="">学生屏幕采集箱</option></select></label><label>采集时长<select id="screen-duration"><option value="15">15 分钟</option><option value="30" selected>30 分钟</option><option value="60">60 分钟</option><option value="90">90 分钟</option><option value="120">120 分钟</option></select></label></div>
      <div class="setup-footer"><label class="strategy">采集策略<select id="screen-mode"><option value="smart">智能混合（推荐）</option><option value="change">内容变化时保存</option><option value="interval">固定间隔</option></select></label><button class="action primary" data-action="start-screen" id="start-screen" disabled>开始采集</button></div>
      <p>采集截图，不录制视频。原件保存在本次采集箱，关联项目不自动投递。</p>
      <p id="setup-message" class="setup-message" role="status"></p>
    </section>
    <div id="details" class="details">
      <div class="links">
        <button class="action needs-student" data-action="import" aria-pressed="false">本机文件导入</button>
        <button class="action needs-student" data-action="inbox" aria-pressed="false" id="inbox">资料收件箱</button>
        <button class="action needs-student" data-action="conversation" aria-pressed="false">对话收集箱</button>
        <button class="action needs-student" data-action="automatic" aria-pressed="false">会话自动采集</button>
        <button class="action" data-action="students">切换学生</button>
      </div>
      <p class="notice">录音跳转主机页面；文件导入和资料投递仍需确认学生与目标。屏幕采集为截图，不是录像。</p>
    </div>
    <div id="message" class="message" role="status" aria-live="polite"></div>
  </div>
  <script src="quick-capture-renderer.js"></script>
</body>
</html>
