name: Android student release integrity
on:
  push:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Android student release
        run: node scripts/check-android-student-release.cjs
      - name: Prevent regression against target branch
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-android-student-release.cjs
