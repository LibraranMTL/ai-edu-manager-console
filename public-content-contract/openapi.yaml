openapi: 3.1.0
info:
  title: AI Education Manager Public Course MVP
  version: 1.0.0
paths:
  /v2/public-content/manifest:
    get:
      summary: Read the active signed public course manifest
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
      responses:
        '200': { description: Signed manifest, headers: { ETag: { schema: { type: string } } } }
        '304': { description: Manifest unchanged }
        '404': { description: No active manifest }
  /v2/public-content/assets/{assetRevisionId}:
    get:
      summary: Read an immutable public content asset
      parameters:
        - in: path
          name: assetRevisionId
          required: true
          schema: { type: string, pattern: '^asset-rev-[a-f0-9]{64}$' }
        - in: header
          name: Range
          schema: { type: string }
      responses:
        '200': { description: Complete asset }
        '206': { description: Asset byte range }
        '304': { description: Asset unchanged }
        '416': { description: Invalid range }
  /v2/public-content/revocations:
    get:
      summary: Read the signed emergency revocation delta
      responses:
        '200': { description: Signed tombstones }
        '304': { description: Revocations unchanged }
        '404': { description: No emergency revocations }
  /v2/public-content/releases/{manifestRevision}:
    get:
      summary: Read one immutable public content release
      parameters:
        - in: path
          name: manifestRevision
          required: true
          schema: { type: string }
      responses:
        '200': { description: Signed release metadata and manifest }
        '404': { description: Release not found }
  /v2/public-content/sync-receipts:
    post:
      summary: Submit a privacy-bounded client synchronization receipt
      description: Stores only a SHA-256 hash of the high-entropy client instance ID. Receipts are unverified telemetry and never device-verification evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptId, clientInstanceId, clientType, clientVersion, outcome]
              properties:
                receiptId: { type: string }
                clientInstanceId: { type: string }
                clientType: { type: string, enum: [windows_host, windows_student, android_student, android_standalone] }
                clientVersion: { type: string }
                outcome: { type: string, enum: [applied, not_modified, network_failed, blocked_signature, blocked_hash, blocked_revocation, lease_expired, incompatible_client] }
                manifestRevision: { type: string }
                revocationRevision: { type: string }
                detailCode: { type: string }
                attemptCount: { type: integer, minimum: 1, maximum: 100 }
                observedAt: { type: string, format: date-time }
      responses:
        '201': { description: Receipt classified and stored }
        '200': { description: Idempotent duplicate receipt }
        '429': { description: Per-source rate limit exceeded }
  /v2/admin/content/assets:
    get:
      summary: List public content assets
      security: [{ adminSession: [] }]
      responses: { '200': { description: Asset inventory } }
    post:
      summary: Upload and register a public image asset
      description: The JSON envelope is limited to 8 MiB; decoded assets are limited to 5 MiB.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, mimeType, contentBase64]
              properties:
                assetId: { type: string }
                mimeType: { type: string, enum: [image/png, image/jpeg, image/webp] }
                contentBase64: { type: string, contentEncoding: base64 }
      responses:
        '201': { description: Immutable asset revision created or reused }
        '413': { description: JSON envelope exceeds 8 MiB }
  /v2/admin/courses:
    get:
      summary: List public course drafts
      security: [{ adminSession: [] }]
      responses: { '200': { description: Course draft inventory } }
    post:
      summary: Create or update a public course draft
      security: [{ adminSession: [] }]
      responses: { '201': { description: Course draft saved } }
  /v2/admin/releases:
    get:
      summary: List immutable release records
      security: [{ adminSession: [] }]
      responses: { '200': { description: Release history } }
  /v2/admin/public-content/operations:
    get:
      summary: Read public content delivery metrics, sync reconciliation and alerts
      security: [{ adminSession: [] }]
      parameters:
        - in: query
          name: windowHours
          schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
      responses: { '200': { description: Aggregated privacy-bounded operations status } }
  /v2/admin/releases/validate:
    post:
      summary: Persist a signed release candidate
      security: [{ adminSession: [] }]
      responses: { '200': { description: Candidate and expected manifest hash }, '409': { description: Candidate contains an emergency-revoked course } }
  /v2/admin/releases/publish:
    post:
      summary: Atomically activate a validated candidate
      security: [{ adminSession: [] }]
      responses: { '200': { description: Active or idempotent result }, '409': { description: Candidate hash changed or now contains an emergency-revoked course } }
  /v2/admin/releases/rollback:
    post:
      summary: Create a new active release from a verified historical manifest
      security: [{ adminSession: [] }]
      responses: { '200': { description: Rollback release active }, '409': { description: Target changed or contains an emergency-revoked course } }
  /v2/admin/releases/emergency-withdraw:
    post:
      summary: Atomically publish a signed tombstone and replacement manifest
      security: [{ adminSession: [] }]
      responses: { '200': { description: Withdrawal active } }
components:
  securitySchemes:
    adminSession:
      type: http
      scheme: bearer
