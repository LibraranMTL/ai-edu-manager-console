<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; media-src blob:;">
<title>快捷拍照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fcfa;color:#172b27;font-family:'Microsoft YaHei',system-ui,sans-serif;padding:20px}h1{font-size:21px;margin:0 0 6px}.sub{font-size:13px;line-height:1.6;color:#617b72;margin:0 0 14px}.preview{position:relative;height:265px;background:#173b31;border-radius:14px;display:grid;place-items:center;overflow:hidden}video,img{width:100%;height:100%;object-fit:contain;position:absolute}.placeholder{color:#cfdfd7;text-align:center;font-size:14px;padding:24px;line-height:1.8}.indicator{display:inline-block;font-size:12px;margin:12px 0;color:#617b72}.indicator.active{color:#a44820}.controls{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #c8ddd4;background:white;color:#155143;border-radius:9px;padding:10px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}button.primary{background:#1d6652;border-color:#1d6652;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #a59bdd;outline-offset:2px}select{border:1px solid #c8ddd4;background:white;border-radius:6px;padding:6px;max-width:100%;margin:6px 0 10px}label{font-size:12px;color:#617b72;display:block}.message{font-size:13px;line-height:1.6;min-height:40px;margin:12px 0 0;overflow-wrap:anywhere}.message.error{color:#a32f28}[hidden]{display:none!important}@media(max-height:520px){body{padding:12px}.preview{height:190px}.sub{margin-bottom:8px}}
</style></head><body>
<h1>快捷拍照</h1><p class="sub" id="owner">正在读取资料所属学生…</p>
<div class="preview"><p class="placeholder" id="placeholder">打开摄像头后，在这里预览画面<br>照片经确认保存到学生收件箱</p><video id="camera" autoplay muted playsinline hidden></video><img id="shot" alt="本次照片预览" hidden></div>
<span class="indicator" id="indicator" role="status">摄像头已关闭</span>
<label id="device-label" hidden>摄像头<select id="device"></select></label>
<div class="controls"><button id="open" class="primary" disabled>打开摄像头</button><button id="take" class="primary" hidden>拍摄</button><button id="retake" hidden>重拍</button><button id="save" class="primary" hidden>保存照片</button><button id="stop" hidden>关闭摄像头</button><button id="close">关闭窗口</button></div>
<p class="message" id="message" role="status"></p>
<script src="quick-photo-renderer.js"></script></body></html>
